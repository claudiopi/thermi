name: "🚀 Release · signed installers and updates"

# thermi's update channels (docs/adr/0008-updates.md, docs/RELEASES.md). Each merge to main goes to beta as
# <version>-beta.<run>; the owner releases Directory.Build.props' version to stable, with its MSIs, and pulls the other
# levers by hand; each month both channels are signed again before their manifests expire. The Linux packages of each
# version go to the same channel of thermi's apt and dnf repositories, and a release to the AUR, the levers acting on
# them too (docs/adr/0019-linux.md). Every job that signs waits for the owner's approval in the release environment.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      lever:
        description: 'release: Directory.Build.props'' version to stable, with its MSIs. The others: a channel''s lever.'
        type: choice
        options: [release, promote, rollback, disable, refresh]
        required: true
      channel:
        type: choice
        options: [stable, beta]
        default: stable
      rollout:
        description: 'The percent of PCs a release or a promotion reaches.'
        default: '10'

permissions:
  contents: read

# Merges queue behind each other, a newer one replacing one still waiting, as its beta holds the older's changes; each of
# the owner's runs has a group of its own, so a merge never cancels one. Two runs that write the same channel anyway are
# caught by scripts/channel-sync.ps1, which refuses a manifest the bucket changed since the run fetched it.
concurrency:
  group: ${{ github.event_name == 'push' && 'release-merges' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  BUCKET: thermi-updates

jobs:
  # Whether the owner's accounts exist, read from the repository's public variables, which a job with no approval reads
  # (docs/RELEASES.md); the secrets and SIGNPATH_ORGANIZATION_ID live in the release environment, out of its sight. A
  # merge or the monthly signing in a repository with none of them is skipped with a notice, not failed; a run by hand
  # fails. Some set and some missing fails every run: such a build would never update, or would take any catalog, and a
  # monthly signing skipped behind a green run would let the manifests expire.
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          THERMI_UPDATES_FROM: ${{ vars.THERMI_UPDATES_FROM }}
          THERMI_UPDATES_SIGNERS: ${{ vars.THERMI_UPDATES_SIGNERS }}
          THERMI_UPDATES_RELEASE_PUB: ${{ vars.THERMI_UPDATES_RELEASE_PUB }}
          THERMI_UPDATES_BACKUP_PUB: ${{ vars.THERMI_UPDATES_BACKUP_PUB }}
          THERMI_REPOSITORY_PUB: ${{ vars.THERMI_REPOSITORY_PUB }}
          AUR_HOST_KEY: ${{ vars.AUR_HOST_KEY }}
        run: |
          $names = 'THERMI_UPDATES_FROM', 'THERMI_UPDATES_SIGNERS', 'THERMI_UPDATES_RELEASE_PUB', 'THERMI_UPDATES_BACKUP_PUB', 'THERMI_REPOSITORY_PUB', 'AUR_HOST_KEY'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          "ready=$($missing.Count -eq 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          if (-not $missing) { exit 0 }
          $why = "The repository's variables $($missing -join ', ') are not set, so this run releases and signs nothing: docs/RELEASES.md says how to set them up."
          if ($env:EVENT -eq 'workflow_dispatch' -or $missing.Count -lt $names.Count) {
            "::error::$why"
            exit 1
          }
          "::notice::Skipped. $why"
          "Skipped. $why" >> $env:GITHUB_STEP_SUMMARY

  build:
    needs: ready
    if: needs.ready.outputs.ready == 'true' && (github.event_name == 'push' || inputs.lever == 'release')
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        processor: [x64, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: version
        shell: pwsh
        env:
          RUN: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
        run: |
          $version = @(([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($env:EVENT -eq 'push') { $version = "$version-beta.$env:RUN" }
          "version=$version" >> $env:GITHUB_OUTPUT
      # Built pointed at the channel, trusting its two public keys and only catalogs thermi's certificates signed.
      - shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROCESSOR: ${{ matrix.processor }}
          FROM: ${{ vars.THERMI_UPDATES_FROM }}
          SIGNERS: ${{ vars.THERMI_UPDATES_SIGNERS }}
          RELEASE_PUB: ${{ vars.THERMI_UPDATES_RELEASE_PUB }}
          BACKUP_PUB: ${{ vars.THERMI_UPDATES_BACKUP_PUB }}
        run: |
          $keys = New-Item (Join-Path $env:RUNNER_TEMP keys) -ItemType Directory -Force
          Set-Content (Join-Path $keys release.pub.pem) $env:RELEASE_PUB
          Set-Content (Join-Path $keys backup.pub.pem) $env:BACKUP_PUB
          . ./scripts/publish.ps1
          Publish-Thermi "artifacts/release/$env:PROCESSOR" $env:PROCESSOR $env:VERSION $env:FROM $keys $env:SIGNERS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.processor }}
          path: artifacts/release/${{ matrix.processor }}

  # Every executable thermi builds is signed, then the catalog is made over the signed files and signed too, so a
  # version runs only with every file thermi shipped.
  sign:
    needs: build
    environment: release
    runs-on: windows-latest
    timeout-minutes: 60
    # The run's artifacts, which this job finds and SignPath fetches by their ids.
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        processor: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The unsigned artifact's id, which SignPath fetches it by: a matrix job's outputs keep only one processor's.
      - id: artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: unsigned-${{ matrix.processor }}
          RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          $id = gh api "repos/$env:REPO/actions/runs/$env:RUN/artifacts" --jq ".artifacts[] | select(.name == \"$env:NAME\") | .id"
          "id=$id" >> $env:GITHUB_OUTPUT
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: thermi
          signing-policy-slug: release
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.artifact.outputs.id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - shell: pwsh
        run: |
          New-Item catalog -ItemType Directory | Out-Null
          New-FileCatalog -Path signed -CatalogFilePath catalog/thermi.cat -CatalogVersion 2.0 | Out-Null
      - id: catalog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-${{ matrix.processor }}
          path: catalog
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: thermi
          signing-policy-slug: release
          artifact-configuration-slug: catalog
          github-artifact-id: ${{ steps.catalog.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-catalog
      - shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PROCESSOR: ${{ matrix.processor }}
        run: |
          Copy-Item signed-catalog/thermi.cat signed/thermi.cat
          New-Item zips -ItemType Directory | Out-Null
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path signed), "$PWD/zips/thermi-$env:VERSION-$env:PROCESSOR.zip", 'Optimal', $false)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip-${{ matrix.processor }}
          path: zips
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.processor }}
          path: signed

  # The release's MSIs, built from the signed files and signed themselves, for people to install by hand.
  msi:
    needs: [build, sign]
    if: inputs.lever == 'release'
    environment: release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        processor: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ matrix.processor }}
          path: signed
      - shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PROCESSOR: ${{ matrix.processor }}
        run: |
          New-Item msi -ItemType Directory | Out-Null
          . ./scripts/publish.ps1
          Build-Msi signed $env:PROCESSOR $env:VERSION "msi/thermi-$env:VERSION-$env:PROCESSOR.msi"
          Build-Msi signed $env:PROCESSOR $env:VERSION "msi/thermi-$env:VERSION-$env:PROCESSOR-user.msi" -PerUser
      - id: msi
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-msi-${{ matrix.processor }}
          path: msi
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: thermi
          signing-policy-slug: release
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-${{ matrix.processor }}
          path: signed-msi

  # The zips and MSIs get build provenance, the zips go up first, and only then the channel's next signed manifest.
  publish:
    needs: [ready, build, sign, msi]
    if: always() && needs.ready.outputs.ready == 'true' && needs.sign.result == 'success' && (needs.msi.result == 'success' || needs.msi.result == 'skipped')
    environment: release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{zip,msi}-*'
          path: out
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/*'
      - shell: pwsh
        run: ./scripts/channel-sync.ps1 down -Version $env:VERSION
        env:
          VERSION: ${{ needs.build.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      - shell: pwsh
        env:
          THERMI_UPDATES_KEY: ${{ secrets.THERMI_UPDATES_KEY }}
          THERMI_UPDATES_RELEASE_PUB: ${{ vars.THERMI_UPDATES_RELEASE_PUB }}
          THERMI_UPDATES_BACKUP_PUB: ${{ vars.THERMI_UPDATES_BACKUP_PUB }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ github.event_name == 'push' && 'beta' || 'stable' }}
          ROLLOUT: ${{ github.event_name == 'push' && '100' || inputs.rollout }}
          FROM: ${{ vars.THERMI_UPDATES_FROM }}
        run: |
          # A release's machine MSIs go in its manifest, for a per-user install's "install for everyone" (docs/adr/0016-admin-on-demand.md).
          $msis = @('x64', 'arm64') | Where-Object { Test-Path "out/thermi-$env:VERSION-$_.msi" } | ForEach-Object { "$_=out/thermi-$env:VERSION-$_.msi" }
          $msi = if ($msis) { @('--msi') + $msis } else { @() }
          pwsh scripts/updates.ps1 publish --folder channels --channel $env:CHANNEL --version $env:VERSION `
            --zip "x64=out/thermi-$env:VERSION-x64.zip" "arm64=out/thermi-$env:VERSION-arm64.zip" --base-url $env:FROM --rollout $env:ROLLOUT @msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The release with its MSIs before the manifest that offers it, so no PC runs a version with no release.
      - if: inputs.lever == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Once made, a run again after a refused upload only puts its MSIs back.
          gh release view "v$env:VERSION" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { gh release upload "v$env:VERSION" (Get-ChildItem out/*.msi).FullName --clobber }
          else { gh release create "v$env:VERSION" (Get-ChildItem out/*.msi).FullName --title "thermi $env:VERSION" --generate-notes }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - shell: pwsh
        run: ./scripts/channel-sync.ps1 up
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

  # The same version's Linux packages, signed with thermi's repository key, published to the channel's apt and dnf
  # repositories under linux/ (docs/adr/0019-linux.md); a release also goes to the AUR as thermi-bin.
  linux:
    needs: [ready, build]
    if: needs.ready.outputs.ready == 'true' && (github.event_name == 'push' || inputs.lever == 'release')
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          FROM: ${{ vars.THERMI_UPDATES_FROM }}
          THERMI_REPOSITORY_KEY: ${{ secrets.THERMI_REPOSITORY_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'repository.key.asc'
          [IO.File]::WriteAllText($key, $env:THERMI_REPOSITORY_KEY)
          pwsh -NoProfile -File scripts/linux-packages.ps1 -Version $env:VERSION -Key $key -UpdatesFrom $env:FROM -Output out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.deb
            out/*.rpm
            out/*.tar.gz
      - shell: pwsh
        run: ./scripts/channel-sync.ps1 down -Linux
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      - shell: pwsh
        env:
          THERMI_REPOSITORY_KEY: ${{ secrets.THERMI_REPOSITORY_KEY }}
          THERMI_REPOSITORY_PUB: ${{ vars.THERMI_REPOSITORY_PUB }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ github.event_name == 'push' && 'beta' || 'stable' }}
        run: |
          pwsh scripts/updates.ps1 publish $env:VERSION --channel $env:CHANNEL --packages out --repository channels/linux
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - shell: pwsh
        run: ./scripts/channel-sync.ps1 up -Linux
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      # Once its tarballs are served: the AUR's PKGBUILD, with the .SRCINFO the AUR reads, which only makepkg writes.
      - if: inputs.lever == 'release'
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_HOST_KEY: ${{ vars.AUR_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          printf 'aur.archlinux.org %s\n' "$AUR_HOST_KEY" > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/thermi-bin.git aur
          cp out/aur/PKGBUILD out/aur/*.install aur/
          docker run --rm --name "thermi-aur-$GITHUB_RUN_ID" -v "$PWD/aur:/aur" archlinux:latest \
            bash -c 'useradd -m builder && chown -R builder /aur && su builder -c "cd /aur && makepkg --printsrcinfo > .SRCINFO" && chown -R '"$(id -u):$(id -g)"' /aur'
          git -C aur add PKGBUILD .SRCINFO ./*.install
          git -C aur -c user.name='thermi releases' -c user.email='17047466+claudiopi@users.noreply.github.com' commit -m "thermi $VERSION"
          git -C aur push origin HEAD:master

  # A lever on a channel, by hand, or each month a new signature on both before their manifests expire.
  lever:
    needs: ready
    if: needs.ready.outputs.ready == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lever != 'release'))
    environment: release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - shell: pwsh
        run: ./scripts/channel-sync.ps1 down
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      - shell: pwsh
        env:
          THERMI_UPDATES_KEY: ${{ secrets.THERMI_UPDATES_KEY }}
          THERMI_UPDATES_RELEASE_PUB: ${{ vars.THERMI_UPDATES_RELEASE_PUB }}
          THERMI_UPDATES_BACKUP_PUB: ${{ vars.THERMI_UPDATES_BACKUP_PUB }}
          LEVER: ${{ github.event_name == 'schedule' && 'refresh' || inputs.lever }}
          CHANNEL: ${{ inputs.channel }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          $levers = switch ($env:LEVER) {
            'refresh' { if ($env:CHANNEL) { , @('refresh', '--channel', $env:CHANNEL) } else { @('refresh', '--channel', 'stable'), @('refresh', '--channel', 'beta') } }
            'promote' { , @('promote', '--from', 'beta', '--to', 'stable', '--rollout', $env:ROLLOUT) }
            default { , @($env:LEVER, '--channel', $env:CHANNEL) }
          }
          foreach ($lever in $levers) {
            pwsh scripts/updates.ps1 @lever --folder channels
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - shell: pwsh
        run: ./scripts/channel-sync.ps1 up
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

  # The same lever on the Linux repositories, or each month a new signature on both before their Release files expire.
  linux-lever:
    needs: ready
    if: needs.ready.outputs.ready == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lever != 'release'))
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - shell: pwsh
        run: ./scripts/channel-sync.ps1 down -Linux
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      - shell: pwsh
        env:
          THERMI_REPOSITORY_KEY: ${{ secrets.THERMI_REPOSITORY_KEY }}
          THERMI_REPOSITORY_PUB: ${{ vars.THERMI_REPOSITORY_PUB }}
          LEVER: ${{ github.event_name == 'schedule' && 'refresh' || inputs.lever }}
          CHANNEL: ${{ inputs.channel }}
          FROM: ${{ vars.THERMI_UPDATES_FROM }}
        run: |
          # The repositories have no rollout: a promotion reaches every PC. A channel nothing was published to has nothing to sign.
          $levers = switch ($env:LEVER) {
            'refresh' {
              @($env:CHANNEL ? $env:CHANNEL : @('stable', 'beta')) | Where-Object { Test-Path "channels/linux/history/$_.json" } |
                ForEach-Object { , @('sign', '--channel', $_) }
            }
            'promote' { , @('promote', '--from', 'beta', '--to', 'stable') }
            default { , @($env:LEVER, '--channel', $env:CHANNEL, '--updates-from', $env:FROM) }
          }
          foreach ($lever in $levers) {
            pwsh scripts/updates.ps1 @lever --repository channels/linux
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - shell: pwsh
        run: ./scripts/channel-sync.ps1 up -Linux
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
