name: Mutation

# Stryker.NET's score of Thermi.Core's tests, which measures them better than coverage. Too slow for every run of CI, so
# it runs weekly, and on a PR only when Core or its tests change. StrykerJS runs in CI's web job, on every PR.
on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'src/Thermi.Core/**'
      - 'tests/Thermi.Tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mutation-pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File scripts/mutation.ps1
