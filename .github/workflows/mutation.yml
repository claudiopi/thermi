name: "🐛 Bug hunt · nightly"

# The Bug hunt: Stryker plants small bugs in Thermi.Core and Thermi.Cli (Stryker.NET) and in the page's logic (StrykerJS),
# one at a time, and measures the share Thermi.Tests and the page's unit tests catch, which tells more of the tests than
# coverage. Too slow to gate a merge, so it runs each night and on demand; each run records its score in its summary,
# keeps its report, and hands its results to CI's 📊 Stats dashboard.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  # One run on a 4-core CI machine took longer than the 90 minutes a job had, so each job mutates a share of the files,
  # balanced by what each cost the last night: the six took 10 to 32 minutes when split by size.
  shares:
    name: 🐛 Bug hunt · Thermi.Core and Thermi.Cli, share ${{ matrix.share }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # The gate saves each file's cost of the last run, to balance the shares.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: TestResults/bughunt-costs.json
          key: bughunt-costs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bughunt-costs-
      # The script writes the job's summary itself.
      - env:
          SHARE: ${{ matrix.share }}/${{ strategy.job-total }}
        run: pwsh -NoProfile -File scripts/mutation.ps1 -Shard $env:SHARE --concurrency $env:NUMBER_OF_PROCESSORS
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-share-${{ matrix.share }}
          path: TestResults/mutation
          if-no-files-found: ignore

  core:
    name: 🐛 Bug hunt · Thermi.Core and Thermi.Cli
    needs: shares
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-share-*
          path: TestResults/shares
      # The script writes the job's summary itself.
      - run: pwsh -NoProfile -File scripts/mutation.ps1 -Gate TestResults/shares
      - if: always() && hashFiles('TestResults/bughunt-costs.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: TestResults/bughunt-costs.json
          key: bughunt-costs-${{ github.run_id }}-${{ github.run_attempt }}
      # Caught and missed, which CI's 📊 Stats dashboard reads from the last run.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-bughunt-core
          path: TestResults/stats/bughunt-*.json
          if-no-files-found: ignore

  web:
    name: 🐛 Bug hunt · the page's logic
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Thermi.Settings.Web/package-lock.json
      - run: npm ci --prefix src/Thermi.Settings.Web --ignore-scripts --no-audit --no-fund
      - run: pwsh -NoProfile -File scripts/mutation.ps1 -Web
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-web
          path: TestResults/mutation-web
          if-no-files-found: ignore
      # Caught and missed, which CI's 📊 Stats dashboard reads from the last run.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-bughunt-web
          path: TestResults/stats/bughunt-*.json
          if-no-files-found: ignore
