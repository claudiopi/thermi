name: "🔐 Security · secrets and packages"

# CI calls this on every PR and push, so the CI gate holds it; it also runs each day, as advisories come out long after a
# package was chosen.
on:
  workflow_call:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('security-pr-{0}', github.event.pull_request.number) || format('security-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # Every commit of every branch: a secret deleted later is still public in the history. The release's binary, checked
  # against its checksums, as a container action would need Docker.
  gitleaks:
    name: 🔐 Secrets · gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .

  packages:
    name: 🛡️ Vulnerable packages
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pwsh -NoProfile -File scripts/audit.ps1

  dependency-review:
    name: 🔎 Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Any package the pull request adds with a known vulnerability, of any severity, from GitHub's dependency graph, as
      # dependency-review-action reads it; asked directly, as that action writes a summary of its own even when all is
      # clean, and a passing run shows the CI's dashboard alone.
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARED: ${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          $pages = gh api "repos/$env:COMPARED" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $added = ($pages | ConvertFrom-Json) | ForEach-Object { $_ } | Where-Object change_type -eq 'added'
          $found = foreach ($package in $added) {
            foreach ($advisory in $package.vulnerabilities) {
              "| ``$($package.name)`` $($package.version) | $($package.ecosystem) | $($advisory.severity) | [$($advisory.advisory_ghsa_id)]($($advisory.advisory_url)) |"
            }
          }
          if (-not $found) {
            "No package this pull request adds has a known vulnerability."
            exit 0
          }
          @('### ❌ Dependency review', '', '| Package | Ecosystem | Severity | Advisory |', '| --- | --- | --- | --- |') + $found + '' |
            Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit 1
