name: "✅ CI · every PR and push"

# Every step of scripts/check.ps1 on every PR and push to main, split in jobs that run side by side; the one required
# check, CI gate, needs them all, so nothing merges red. A check on a PC runs only what a change can affect; this never.
on:
  pull_request:
    # "edited" re-checks the title after it changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its previous run. On main every run has its own group,
# because GitHub cancels a pending run in the same group even without cancel-in-progress.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  # Restore, format, build, the notices, the SDK's package, the test count, and Thermi.Tests with Core's coverage gate.
  # Each .NET job builds for itself: the build of thermi builds the settings window's page, which needs Node 22.12 or later.
  core:
    name: 🧱 Core · build, format, tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet compares tests/test-count.json with the commit before: on a pull request, its base branch's. A pull
          # request's run is GitHub's merge of it into that branch, whose raise passes when a commit of the pull request made it
          # alone, which only the whole history shows.
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part Core
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-core
          path: TestResults/stats
          if-no-files-found: ignore

  # The Windows tests that run in parallel.
  windows:
    name: 🪟 Windows tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The window's tests host the page in WebView2, which a runner's image may lack.
      - run: pwsh -NoProfile -File scripts/webview2.ps1
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part Windows
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-windows
          path: TestResults/stats
          if-no-files-found: ignore
      # The app's coverage of each test process, which the dashboard merges with the other Windows job's.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: TestResults/app/*.json
          if-no-files-found: ignore

  # The slow Windows tests, which run one at a time: those that count the whole process's handles and windows, as
  # LeakTests' ten thousand rounds, then FullLoadTests, which spins every core.
  windows-alone:
    name: 🐢 Windows tests, one at a time
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The window's tests host the page in WebView2, which a runner's image may lack.
      - run: pwsh -NoProfile -File scripts/webview2.ps1
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part WindowsAlone
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-windows-alone
          path: TestResults/stats
          if-no-files-found: ignore
      # The app's coverage of each test process, which the dashboard merges with the other Windows job's.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows-alone
          path: TestResults/app/*.json
          if-no-files-found: ignore

  # Thermi.Tests on Linux: Core, the CLI and the repo rules hold on every OS that thermi runs on, as Linux's .NET reads
  # paths, cultures and files its own way.
  linux-core:
    name: 🐧 Thermi.Tests on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part LinuxCore
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-linux-core
          path: TestResults/stats
          if-no-files-found: ignore

  # The tests that need Linux: the sensor service, its socket, thermi against compositors of the tests' own, and the
  # packages installed and updated in containers of each distribution, which take the most of its time.
  linux:
    name: 🐧 Linux tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # thermi's build builds the settings window's page, with the Node the page's own jobs use.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Thermi.Settings.Web/package-lock.json
      # GNOME Shell headless, on Wayland and on Xvfb, with gjs, which runs the Shell's notifications service; the GTK and
      # Pango thermi paints with, the WebKitGTK its settings window shows its page in, AT-SPI for its menus, ImageMagick for
      # the screenshots, and the system monitor its menu opens.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-shell gjs mutter dbus-x11 dbus-user-session
          at-spi2-core gir1.2-atspi-2.0 python3-gi libgtk-4-1 libwebkitgtk-6.0-4 imagemagick xvfb xwayland xdotool x11-utils
          gnome-system-monitor fonts-dejavu-core
      # KWin, with kscreen-doctor and Qt on Wayland, which moves its monitors, and Sway, both nested in Xvfb; Weston, which
      # offers neither the extension nor layer surfaces; Xfwm4 and its panel for X11, on Xorg's dummy driver for its
      # monitors, with xrandr; gtk4-layer-shell, and GTK and Cairo from Python for the tests' own windows and panel; KDE's
      # portal, which takes hotkeys on KWin, with the controls its dialog is made of.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends kwin-wayland kscreen qt6-wayland sway
          weston xfwm4 xfce4-panel xfconf xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils libgtk4-layer-shell0
          gir1.2-gtk4layershell-1.0 gir1.2-gtk-4.0 python3-gi-cairo mesa-vulkan-drivers xdg-desktop-portal
          xdg-desktop-portal-kde qml6-module-org-kde-kquickcontrols
      # The shells thermi-cli is run from in the tests, beside bash, and the tools the repositories' indexes are written with.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish apt-utils createrepo-c rpm-common
      # The tests' own user manager runs in a scope the runner's own delegates, which only a lingering user has.
      - run: sudo loginctl enable-linger "$(id -un)"
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part Linux
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-linux
          path: TestResults/stats
          if-no-files-found: ignore
      # The app's coverage of the Linux tests' process, which the dashboard shows apart from the Windows tests'.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: TestResults/app/*.json
          if-no-files-found: ignore

  # Thermi.Tests on macOS, on Apple silicon: Core, the CLI and the repo rules hold on the Mac too, whose .NET reads paths,
  # cultures and files its own way, on a file system that ignores case.
  macos-core:
    name: 🍎 Thermi.Tests on macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part MacCore
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-macos-core
          path: TestResults/stats
          if-no-files-found: ignore

  # The tests that need macOS, and the build of thermi.app with .NET for macOS, which needs Xcode. The runner is a session
  # made for tests: a user of its own, whose screen and launchd no person uses, as THERMI_TEST_SESSION tells the tests.
  macos:
    name: 🍎 macOS tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # The workload set 10.0.401 pins .NET for macOS 26.5.10318, which builds only with Xcode 26.6: both are pinned together,
      # as the image's default Xcode moves on, and the workload's later sets need an Xcode the image does not have yet.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: dotnet workload install macos --version 10.0.401
      - run: echo "THERMI_TEST_SESSION=$(id -un)" >> "$GITHUB_ENV"
      # The rows over SSH log in to this Mac as its user, as a person reaches a Mac with no one signed in: Remote Login on,
      # with a key of the job's own.
      - name: SSH to this Mac
        run: |
          sudo launchctl enable system/com.openssh.sshd
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/ssh.plist || true
          # Remote Login admits only the members of this group, where it is set to some users alone.
          if dscl . -read /Groups/com.apple.access_ssh > /dev/null 2>&1; then
            sudo dseditgroup -o edit -a "$USER" -t user com.apple.access_ssh
          fi
          # sshd reads a key only from a home and a folder no one else may write.
          chmod go-w ~
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          for _ in $(seq 20); do ssh-keyscan -t ed25519 localhost >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 1; done
          ssh -o BatchMode=yes localhost true || { ssh -v -o BatchMode=yes localhost true; exit 1; }
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part MacOS
      # thermi-sensors as the app ships it, and what it reads on this virtual Mac, which tests/Thermi.Tests/Recordings/Mac
      # keeps as the macOS VM's recording, scrubbed as every recording is.
      - if: always()
        name: Record this Mac
        run: |
          dotnet publish src/Thermi.Sensors.MacOS -c Release -r osx-arm64 --self-contained -o artifacts/mac/thermi-sensors
          mkdir -p artifacts/mac/recording
          artifacts/mac/thermi-sensors/thermi-sensors --raw artifacts/mac/recording/macos-vm --dump artifacts/mac/recording/macos-vm.json --seconds 5
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-sensors
          path: artifacts/mac
          if-no-files-found: ignore
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-macos
          path: TestResults/stats
          if-no-files-found: ignore
      # The app's coverage of the macOS tests' process, which the dashboard shows apart from the other OSes'.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-macos
          path: TestResults/app/*.json
          if-no-files-found: ignore

  # The settings window's page: its build with its type check, the test count, lint, react-doctor, unit tests, dead code
  # and the page's tests with axe in the Edge that Windows ships, so no browser is downloaded.
  web:
    name: 🎨 Settings page · Playwright + axe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet compares tests/test-count.json with the commit before: on a pull request, its base branch's. A pull
          # request's run is GitHub's merge of it into that branch, whose raise passes when a commit of the pull request made it
          # alone, which only the whole history shows.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Thermi.Settings.Web/package-lock.json
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part Web
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-web
          path: TestResults/stats
          if-no-files-found: ignore

  # The page's tests on Linux, in WebKit and Chromium, as Linux's window runs the page in WebKitGTK: in Playwright's own
  # image, whose browsers and the libraries they need match the version the page pins.
  web-linux:
    name: 🎨 Settings page on Linux · WebKit + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    defaults:
      run:
        working-directory: src/Thermi.Settings.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright test

  # The MSIs of this build for both processors, unsigned and with updates off, so a change that breaks one fails here and
  # not at a release: each carries the custom actions' DLL of its own processor.
  msi:
    name: 📦 Installers · x64 + Arm64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - shell: pwsh
        run: |
          . ./scripts/publish.ps1
          . ./scripts/summary.ps1
          $version = @(([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $files = @()
          foreach ($processor in 'x64', 'arm64') {
            Publish-Thermi "artifacts/ci-msi-$processor" $processor $version
            Build-Msi "artifacts/ci-msi-$processor" $processor $version "thermi-$version-$processor.msi"
            Build-Msi "artifacts/ci-msi-$processor" $processor $version "thermi-$version-$processor-user.msi" -PerUser
            foreach ($msi in "thermi-$version-$processor.msi", "thermi-$version-$processor-user.msi") {
              $files += @{ name = $msi; processor = $processor; perUser = $msi -like '*-user.msi'; megabytes = (Get-Item $msi).Length / 1MB }
            }
          }
          Save-Stats 'msi' @{ files = $files }
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-msi
          path: TestResults/stats
          if-no-files-found: ignore

  pr-title:
    name: 🏷️ PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The title becomes the squash commit, so it follows Conventional Commits.
      # It is read from env, never interpolated into the script.
      - shell: pwsh
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ($env:TITLE -notmatch '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([\w-]+\))?!?: \S') {
            Write-Output "::error::PR title '$env:TITLE' must look like 'fix: short summary' (Conventional Commits)."
            exit 1
          }

  # Secrets in the history and known vulnerable packages; it also runs each day on its own.
  security:
    uses: ./.github/workflows/security.yml

  # The run's dashboard, the only summary of a run that passes, as the other jobs write theirs only when they fail:
  # scripts/stats.ps1, from what each job measured, whichever failed. On a push to main it also adds the run to the stats
  # branch's history, which the README's badges read. Data a job left missing shows as missing; a broken script fails
  # it, and so the gate.
  stats:
    name: 📊 Stats dashboard
    if: ${{ !cancelled() }}
    needs: [core, windows, windows-alone, linux-core, linux, macos-core, macos, web, web-linux, msi, pr-title, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The stats branch, which only a push to main writes.
      contents: write
      # The run's jobs and their times, and the last Bug hunt's artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stats-*
          path: TestResults/stats
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: TestResults/app
          merge-multiple: true
      - name: What GitHub knows of the run
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pwsh -NoProfile -File scripts/stats-github.ps1
      - name: The dashboard
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/stats.ps1 -History TestResults/stats-history.json -Out TestResults/dashboard.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content TestResults/dashboard.md -Raw | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: The stats branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: pwsh -NoProfile -File scripts/stats-github.ps1 -Push

  # The only required check on main (docs/RELEASES.md): jobs can change without touching branch protection, and one that
  # failed, was cancelled or was skipped fails it.
  ci-gate:
    name: CI gate
    if: always()
    needs: [core, windows, windows-alone, linux-core, linux, macos-core, macos, web, web-linux, msi, pr-title, security, stats]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Only when it fails, its own table of each job's result, as the dashboard may be the job that failed.
      - if: >-
          needs.core.result != 'success' || needs.windows.result != 'success' || needs.windows-alone.result != 'success' ||
          needs.linux-core.result != 'success' || needs.linux.result != 'success' || needs.macos-core.result != 'success' ||
          needs.macos.result != 'success' || needs.web.result != 'success' ||
          needs.web-linux.result != 'success' ||
          needs.msi.result != 'success' || needs.security.result != 'success' || needs.stats.result != 'success' ||
          (github.event_name == 'pull_request' && needs.pr-title.result != 'success')
        shell: pwsh
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          $icons = @{ success = '✅'; failure = '❌'; cancelled = '🚫'; skipped = '⏭️' }
          $rows = (ConvertFrom-Json $env:NEEDS).PSObject.Properties | ForEach-Object { "| $($icons[$_.Value.result]) | $($_.Name) | $($_.Value.result) |" }
          @('### ❌ CI gate', '', '| | Job | Result |', '| :-: | --- | --- |') + $rows + '' | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit 1
