name: "✅ CI · every PR and push"

# Every step of scripts/check.ps1 on every PR and push to main, split in jobs that run side by side; the one required
# check, CI gate, needs them all, so nothing merges red. A check on a PC runs only what a change can affect; this never.
on:
  pull_request:
    # "edited" re-checks the title after it changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its previous run. On main every run has its own group,
# because GitHub cancels a pending run in the same group even without cancel-in-progress.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  # Restore, format, build, the notices, the SDK's package, the test count, and Thermi.Tests with Core's coverage gate.
  # Each .NET job builds for itself: the build of thermi builds the settings window's page, which needs Node 22.12 or later.
  core:
    name: 🧱 Core · build, format, tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet compares tests/test-count.json with the commit before: on a pull request, its base branch's. A pull
          # request's run is GitHub's merge of it into that branch, whose raise passes when a commit of the pull request made it
          # alone, which only the whole history shows.
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part Core
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-core
          path: TestResults/stats
          if-no-files-found: ignore

  # The Windows tests that run in parallel.
  windows:
    name: 🪟 Windows tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The window's tests host the page in WebView2, which a runner's image may lack.
      - run: pwsh -NoProfile -File scripts/webview2.ps1
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part Windows
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-windows
          path: TestResults/stats
          if-no-files-found: ignore
      # The app's coverage of each test process, which the dashboard merges with the other Windows job's.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: TestResults/app/*.json
          if-no-files-found: ignore

  # The slow Windows tests, which run one at a time: those that count the whole process's handles and windows, as
  # LeakTests' ten thousand rounds, then FullLoadTests, which spins every core.
  windows-alone:
    name: 🐢 Windows tests, one at a time
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The window's tests host the page in WebView2, which a runner's image may lack.
      - run: pwsh -NoProfile -File scripts/webview2.ps1
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part WindowsAlone
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-windows-alone
          path: TestResults/stats
          if-no-files-found: ignore
      # The app's coverage of each test process, which the dashboard merges with the other Windows job's.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows-alone
          path: TestResults/app/*.json
          if-no-files-found: ignore

  # Thermi.Tests on Linux: Core, the CLI and the repo rules hold on every OS that thermi runs on, as Linux's .NET reads
  # paths, cultures and files its own way.
  linux-core:
    name: 🐧 Thermi.Tests on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part LinuxCore
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-linux-core
          path: TestResults/stats
          if-no-files-found: ignore

  # The tests that need Linux: the sensor service, its socket, and thermi against compositors of the tests' own.
  linux:
    name: 🐧 Linux tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # The tests' own user manager runs in a scope the runner's own delegates, which only a lingering user has.
      - run: sudo loginctl enable-linger "$(id -un)"
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part Linux
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-linux
          path: TestResults/stats
          if-no-files-found: ignore

  # The settings window's page: its build with its type check, the test count, lint, react-doctor, unit tests, dead code
  # and the page's tests with axe in the Edge that Windows ships, so no browser is downloaded.
  web:
    name: 🎨 Settings page · Playwright + axe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet compares tests/test-count.json with the commit before: on a pull request, its base branch's. A pull
          # request's run is GitHub's merge of it into that branch, whose raise passes when a commit of the pull request made it
          # alone, which only the whole history shows.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Thermi.Settings.Web/package-lock.json
      - run: pwsh -NoProfile -File scripts/check.ps1 -Ci -Part Web
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-web
          path: TestResults/stats
          if-no-files-found: ignore

  # The MSIs of this build for both processors, unsigned and with updates off, so a change that breaks one fails here and
  # not at a release: each carries the custom actions' DLL of its own processor.
  msi:
    name: 📦 Installers · x64 + Arm64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - shell: pwsh
        run: |
          . ./scripts/publish.ps1
          . ./scripts/summary.ps1
          $version = @(([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $rows = '### 📦 MSIs', '', '| | MSI | Size |', '| :-: | --- | --: |'
          $files = @()
          foreach ($processor in 'x64', 'arm64') {
            Publish-Thermi "artifacts/ci-msi-$processor" $processor $version
            Build-Msi "artifacts/ci-msi-$processor" $processor $version "thermi-$version-$processor.msi"
            Build-Msi "artifacts/ci-msi-$processor" $processor $version "thermi-$version-$processor-user.msi" -PerUser
            foreach ($msi in "thermi-$version-$processor.msi", "thermi-$version-$processor-user.msi") {
              $megabytes = (Get-Item $msi).Length / 1MB
              $rows += '| ✅ | `{0}` | {1:n1} MB |' -f $msi, $megabytes
              $files += @{ name = $msi; processor = $processor; perUser = $msi -like '*-user.msi'; megabytes = $megabytes }
            }
          }
          $rows + '' | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Save-Stats 'msi' @{ files = $files }
      # What the job measured, for the 📊 Stats dashboard.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-msi
          path: TestResults/stats
          if-no-files-found: ignore

  pr-title:
    name: 🏷️ PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The title becomes the squash commit, so it follows Conventional Commits.
      # It is read from env, never interpolated into the script.
      - shell: pwsh
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ($env:TITLE -notmatch '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([\w-]+\))?!?: \S') {
            Write-Output "::error::PR title '$env:TITLE' must look like 'fix: short summary' (Conventional Commits)."
            exit 1
          }

  # Secrets in the history and known vulnerable packages; it also runs each day on its own.
  security:
    uses: ./.github/workflows/security.yml

  # The run's dashboard in its summary, from what each job measured, whichever failed: scripts/stats.ps1. On a push to
  # main it also adds the run to the stats branch's history, which the README's badges read. Data a job left missing
  # shows as missing; a broken script fails it, and so the gate.
  stats:
    name: 📊 Stats dashboard
    if: ${{ !cancelled() }}
    needs: [core, windows, windows-alone, linux-core, linux, web, msi, pr-title, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The stats branch, which only a push to main writes.
      contents: write
      # The run's jobs and their times, and the last Bug hunt's artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stats-*
          path: TestResults/stats
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: TestResults/app
          merge-multiple: true
      - name: What GitHub knows of the run
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pwsh -NoProfile -File scripts/stats-github.ps1
      - name: The dashboard
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/stats.ps1 -History TestResults/stats-history.json -Out TestResults/dashboard.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content TestResults/dashboard.md -Raw | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: The stats branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: pwsh -NoProfile -File scripts/stats-github.ps1 -Push

  # The only required check on main (docs/RELEASES.md): jobs can change without touching branch protection, and one that
  # failed, was cancelled or was skipped fails it.
  ci-gate:
    name: CI gate
    if: always()
    needs: [core, windows, windows-alone, linux-core, linux, web, msi, pr-title, security, stats]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # One row per job, each of which wrote its own table: what ran, what it measured and how long it took.
      - shell: pwsh
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          $icons = @{ success = '✅'; failure = '❌'; cancelled = '🚫'; skipped = '⏭️' }
          $rows = (ConvertFrom-Json $env:NEEDS).PSObject.Properties | ForEach-Object { "| $($icons[$_.Value.result]) | $($_.Name) | $($_.Value.result) |" }
          @('### CI gate', '', '| | Job | Result |', '| :-: | --- | --- |') + $rows + '' | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - if: >-
          needs.core.result != 'success' || needs.windows.result != 'success' || needs.windows-alone.result != 'success' ||
          needs.linux-core.result != 'success' || needs.linux.result != 'success' || needs.web.result != 'success' ||
          needs.msi.result != 'success' || needs.security.result != 'success' || needs.stats.result != 'success' ||
          (github.event_name == 'pull_request' && needs.pr-title.result != 'success')
        run: exit 1
