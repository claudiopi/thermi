name: Bug report
description: Something shows a wrong value, crashes, or looks broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: thermi version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: CPU, GPU and motherboard. Sensor bugs depend on them.
    validations:
      required: true
  - type: dropdown
    id: pawnio
    attributes:
      label: Is PawnIO installed?
      options: ["Yes", "No", "Don't know"]
