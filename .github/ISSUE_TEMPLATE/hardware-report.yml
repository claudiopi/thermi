name: Hardware report
description: How thermi did on your PC, right or wrong. It helps us test hardware we do not have.
labels: [hardware]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks. A report that everything looked right helps as much as one that something broke.
        Before you attach a file, look it over: the logs name files under your profile, so they may show your Windows user name.
  - type: input
    id: version
    attributes:
      label: thermi version
      description: The settings window's About shows it.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Desktop or laptop
      options:
        - Desktop
        - Laptop
        - Other (say below)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version, or Linux distribution and desktop
      description: On Windows, Settings > System > About shows it; on Linux, the distribution and the desktop, with GNOME's version.
      placeholder: Windows 11 24H2, Windows 10 22H2, or Ubuntu 26.04 with GNOME 50
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: Intel Core i5-1240P
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Every GPU, the CPU's own graphics included.
      placeholder: AMD Radeon RX 7800 XT, Intel Iris Xe
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Motherboard, or the laptop's model
      placeholder: MSI B650 Tomahawk, or Lenovo ThinkPad T14 Gen 3
  - type: checkboxes
    id: tried
    attributes:
      label: What you tried
      description: >-
        What thermi's development PC cannot check, and we would love reports on. Tick what you tried, and say below how it went.
      options:
        - label: "Windows 10 22H2: the settings window in light, dark and high contrast, and the overlay on the taskbar at each edge and hidden"
        - label: "Arm64: the machine MSI installs, and the overlay reads the CPU, the GPU and the fans"
        - label: "A laptop: the battery's items, unplugged, asleep and woken with an external monitor; Ctrl+wheel on a precision touchpad"
        - label: "A board whose CPU fan follows the load: the fan finder picks the CPU fan"
        - label: "A taskbar at the top, or a third-party one: the overlay sits on it where it is dropped"
        - label: "Linux: an Intel or AMD GPU, a laptop's battery, another board's chip or an Arm64 PC, as thermi-cli sensors lists them and the overlay shows them on GNOME"
  - type: textarea
    id: dumps
    attributes:
      label: What the sensors read
      description: >-
        Run `thermi-sensors --dump admin.json` in a terminal opened as administrator, and
        `thermi-sensors --dump user.json` in a normal one, and attach both files.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: A screenshot of the overlay
      description: Paste it here, and one of the settings window if something looked wrong there.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What looked wrong
      description: A missing or wrong value, the overlay out of place, a notice, a crash. Or "nothing".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        If something went wrong, attach `thermi.log` and, for the settings window, `thermi-window.log`, from `%LOCALAPPDATA%\thermi`.
